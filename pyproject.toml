[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sponge29sp-robotctrl_jd365"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出机器人运动控制工程师·灰度发布与版本回滚上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sponge29sp" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sponge29sp.github.io"
Repository = "https://github.com/sponge29sp/robotctrl_jd365"
Issues = "https://github.com/sponge29sp/robotctrl_jd365/issues"

[project.scripts]
robotctrl_jd365 = "robotctrl_jd365:main"

[tool.setuptools]
py-modules = ["robotctrl_jd365"]
